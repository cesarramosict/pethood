# Nom de l'application
spring.application.name=pethood

# Connexion à MariaDB (XAMPP) : la base est créée si elle n'existe pas
spring.datasource.url=jdbc:mariadb://localhost:3306/pethood?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate ne crée pas les tables : Flyway s'en charge
spring.jpa.hibernate.ddl-auto=none

# Afficher les requêtes SQL dans la console
spring.jpa.show-sql=true

# Activer les migrations Flyway (dossier db/migration)
spring.flyway.enabled=true